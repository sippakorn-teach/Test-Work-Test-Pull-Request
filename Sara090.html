<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara 090</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #007acc, #005999);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 25px 20px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .info-group:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #555;
        }

        .value {
            color: #222;
        }

        .skills {
            margin-top: 15px;
        }

        .tag {
            display: inline-block;
            background: #eef5fc;
            color: #007acc;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            margin-right: 5px;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <img src="https://i.ibb.co/VYgFk48W/your-image-name.jpg" alt="Profile Picture" class="profile-img">
            <h1>Sara Janu</h1>
            <p>ครูพิเศษสอนวิทยาลัยเทคนิคกระบี่</p>
        </div>

        <div class="content">
            <div class="info-group">
                <span class="label">รหัสนักศึกษา:</span>
                <span class="value">63030090</span>
            </div>

            <div class="info-group">
                <span class="label">อีเมล:</span>
                <span class="value">Sippakorn3212@gmail.com</span>
            </div>

            <div class="info-group">
                <span class="label">แผนก / สาขา:</span>
                <span class="value">เทคโนโลยีสารสนเทศ</span>
            </div>

            <div class="skills">
                <span class="label">ทักษะความสามารถ:</span><br>
                <span class="tag">HTML5 / CSS3</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Git & GitHub</span>
            </div>
        </div>
    </div>

</body>
</html>
